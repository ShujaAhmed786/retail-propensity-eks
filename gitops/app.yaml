apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-propensity
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ShujaAhmed786/retail-propensity-eks
    targetRevision: main
    path: helm/retail-propensity
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
