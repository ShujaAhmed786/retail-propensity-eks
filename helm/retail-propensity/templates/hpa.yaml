apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retail-propensity
  labels:
    app: retail-propensity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retail-propensity
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
